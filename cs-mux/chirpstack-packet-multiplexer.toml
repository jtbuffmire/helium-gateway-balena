# Logging settings.
[logging]
  # Log level.
  #
  # Valid options are:
  #   * TRACE
  #   * DEBUG
  #   * INFO
  #   * WARN
  #   * ERROR
  level = "debug"

# Multiplexer configuration.
[multiplexer]
  # Interface:port of UDP bind.
  #
  # This is the interface:port on which the Multiplexer will receive
  # data from the gateways.
  bind = "0.0.0.0:1700"

  # Server 1: Local gateway-rs on port 1680
  [[multiplexer.server]]
    # Hostname:port of the server.
    server = "gateway-rs:1680"
    
    # Only allow uplink.
    #
    # If set to true, any downlink will be discarded.
    uplink_only = false

  # Server 2: Direct path to the buoy LNS (ChirpStack us915 gateway bridge).
  # Needed where Helium's region map disagrees with the deployment's channel
  # plan (e.g. Costa Rica = AS923_1 on Helium, but the site runs US915):
  # gateway-rs can't transmit downlinks there, so joins/downlinks ride this
  # direct path instead. uplink_only = false because join accepts must come
  # back through it.
  [[multiplexer.server]]
    server = "lns.buoy.fish:1701"
    uplink_only = false

# Monitoring configuration.
[monitoring]
  # Interface:port.
  #
  # If set, this will enable the monitoring endpoints. If not set, the endpoint
  # will be disabled. Endpoints:
  #
  # * /metrics: Exposes Prometheus metrics.
  bind = "0.0.0.0:9090"